name: Ad-hoc build
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
env:
  INPUT_VERSION: '${{ github.event.inputs.version }}'
jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Cake publish script
        uses: cake-build/cake-action@v1
        with:
          target: PublishWindows
      - name: Rename executable
        run: Rename-Item -Path "CPCSharp.Avalonia/bin/Release/net10.0-windows/win-x64/publish/CPCSharp.Avalonia.exe" -NewName "CPCSharp.exe"
      - name: Publish artifacts
        uses: actions/upload-artifact@v2
        with:
          name: Windows Executable
          path: CPCSharp.Avalonia/bin/Release/net10.0-windows/win-x64/publish/CPCSharp.exe
  package-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Import codesigning certificates
        uses: apple-actions/import-codesign-certs@v1
        with: 
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_PASSWORD }}
      - name: Cake publish script
        uses: cake-build/cake-action@v1
        env: 
          APPLE_ID: ${{ secrets.NOTARIZATION_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: AJ9VCT4GE7
        with:
          target: ExternalPublishMac
      - name: Zip App Bundle
        run: ditto -V -c -k --keepParent BuildArtifacts/CPC#.app BuildArtifacts/CPC#.zip
      - name: Publish artifacts
        uses: actions/upload-artifact@v2
        with:
          name: macOS Executable
          path: BuildArtifacts/CPC#.zip